[package]
name = "uet-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
uet-core.workspace = true
url.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "tracing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "gzip", "brotli", "stream", "socks"] }
moka = { version = "0.12", features = ["future"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
